name: build

on:
  push:
    branches:
      - main
    # 只有会影响镜像内容的路径变了才重建 —— 改文档、改模板不触发构建。
    paths:
      - 'container/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitea/workflows/build.yaml'
  # v* 版本标签由 release.yaml 触发（那边不带 paths 过滤），复用本文件的构建逻辑
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# 内网出网代理（拉 Docker Hub / gcr.io 的基础镜像）。没有代理就留空。
# NO_PROXY 里必须包含 secrets.REGISTRY 的主机名，否则推镜像也会走代理。
env:
  HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
  HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
  NO_PROXY: ${{ secrets.NO_PROXY }}

# 镜像标签规则（docker/metadata-action）：
#   main 上         → sha-<短 commit sha> + latest
#   打 vX.Y.Z tag   → sha-<短 commit sha> + vX.Y.Z
# sha- 前缀那个是**不可变**的：部署清单/Sealos 模板钉它（别钉 latest）。
#
# 与 .github/workflows/build.yaml 的差异（内网 Gitea）：
#   * 只构建 linux/amd64 —— 本集群没有 binfmt/QEMU，且安全基线不允许特权容器。
#   * registry 用 secrets.REGISTRY（只写主机名），登录用 PAT —— Gitea 的 GITEA_TOKEN
#     不能推 OCI 镜像（官方文档明确）。
#   * Gitea 默认先扫描 .gitea/workflows；该目录存在时 .github/workflows 整个不扫描。

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PASS }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY }}/${{ github.repository }}/controller
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/controller.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 显式开启层缓存（平台默认关闭）；ref 换成别的仓库也可以
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ github.repository }}/controller/cache:latest
          cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ github.repository }}/controller/cache:latest,mode=max

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PASS }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY }}/${{ github.repository }}/runner
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            # 老 tag，部署清单与池配置都在用，别去掉
            type=raw,value=ubuntu-latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/runner.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ github.repository }}/runner/cache:latest
          cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ github.repository }}/runner/cache:latest,mode=max
